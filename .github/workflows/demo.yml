name: Demo release checks

on:
  push:
    branches: [main, release-verify]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile app/main.py app/demo_data.py
      - run: python -m pip install -q pytest
      - run: pytest -q tests/test_demo_release.py
