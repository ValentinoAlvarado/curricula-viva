# Despliegue de Currícula Viva.
#
# Arquitectura: FastAPI y Streamlit son procesos Python de larga vida con
# estado; Vercel es serverless y no los sostiene. Se despliegan en Render,
# que sí ejecuta procesos persistentes, con PostgreSQL gestionado.
#
#   Frontend  Streamlit  -> servicio web
#   Backend   FastAPI    -> servicio web
#   Datos     PostgreSQL -> base gestionada, persistente
#
# El artefacto de vectores viaja versionado en el repositorio, así que el
# servicio no instala el modelo de representación.

databases:
  - name: curricula-db
    databaseName: curricula
    plan: free

services:
  - type: web
    name: curricula-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curricula-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13"

  - type: web
    name: curricula-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run app/main.py
      --server.port $PORT --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: API_URL
        fromService:
          name: curricula-api
          type: web
          property: hostport
      - key: PYTHON_VERSION
        value: "3.13"
